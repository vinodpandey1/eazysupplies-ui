# Replace the existing `location /` block in the eazysupplies.com server block.
location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  proxy_cache eazysupplies_storefront;
  proxy_cache_key "$scheme://$host$request_uri";
  proxy_cache_methods GET HEAD;
  proxy_cache_bypass $storefront_skip_cache;
  proxy_no_cache $storefront_skip_cache $upstream_http_set_cookie;
  proxy_cache_valid 200 10m;
  proxy_cache_valid 301 302 10m;
  proxy_cache_valid any 0;
  proxy_cache_lock on;
  proxy_cache_lock_timeout 10s;
  proxy_cache_background_update on;
  proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;

  # Next marks dynamic documents private. This override is safe only because the
  # maps above restrict caching to cookie-free public HTML routes.
  proxy_ignore_headers Cache-Control Expires;
  add_header X-Storefront-Cache $upstream_cache_status always;
}
