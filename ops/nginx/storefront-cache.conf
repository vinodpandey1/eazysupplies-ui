# Install as /etc/nginx/conf.d/storefront-cache.conf.
# These directives belong in Nginx's http context (conf.d is included there).
proxy_cache_path /var/cache/nginx/eazysupplies
  levels=1:2
  keys_zone=eazysupplies_storefront:20m
  max_size=1g
  inactive=60m
  use_temp_path=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

map $request_method $storefront_skip_method {
  default 1;
  GET 0;
  HEAD 0;
}

map $http_accept $storefront_skip_non_html {
  default 1;
  ~*text/html 0;
}

map $http_cookie $storefront_skip_cookie {
  default 1;
  "" 0;
}

map $request_uri $storefront_skip_private_path {
  default 0;
  ~*^/(api|auth|account|cart|checkout|compare|order|payment|wishlist)(/|\?|$) 1;
  ~*[?&]_rsc= 1;
}

map "$storefront_skip_method:$storefront_skip_non_html:$storefront_skip_cookie:$storefront_skip_private_path:$http_upgrade" $storefront_skip_cache {
  default 1;
  "0:0:0:0:" 0;
}
